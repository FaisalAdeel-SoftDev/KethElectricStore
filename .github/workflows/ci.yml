
name: KethElectStore CI Build

on:
  push:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Publish KethElectStore
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v6

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Display .NET Version
        run: dotnet --version

      - name: Restore NuGet Packages
        run: dotnet restore ./KethElectStore/KethElectStore.csproj

      - name: Build Application
        run: dotnet build ./KethElectStore/KethElectStore.csproj --configuration Release --no-restore

      - name: Publish Application
        run: dotnet publish ./KethElectStore/KethElectStore.csproj --configuration Release --no-build --output ./publish

      - name: Upload Published Files
        uses: actions/upload-artifact@v4
        with:
          name: KethElectStore-publish
          path: ./publish/
          if-no-files-found: error
          retention-days: 14
